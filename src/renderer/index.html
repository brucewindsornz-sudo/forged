<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forged</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="titlebar">
      <div class="brand"><img class="mark" src="forged-mark.png" alt="">Forged</div>
      <div id="tabs"></div>
    </header>
    <div id="options"></div>
    <aside id="toolbar"></aside>
    <main id="stage">
      <canvas id="view"></canvas>
      <textarea id="text-editor" spellcheck="false" autocomplete="off"></textarea>
      <div id="welcome"></div>
      <div class="drop-hint">Drop photos or PDFs to open or place them</div>
    </main>
    <aside id="panels"></aside>
    <section id="bin">
      <div class="bin-label">Photo Bin</div>
      <div id="bin-items"></div>
    </section>
    <footer id="status"></footer>
  </div>
  <div id="toasts"></div>
  <div id="busy"><div class="busy-pill"><div class="spinner"></div><span>Working…</span></div></div>
  <div id="modal-root"></div>
  <input id="color-input" type="color" tabindex="-1" aria-hidden="true">

  <script src="js/util.js"></script>
  <script src="js/adjustments.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/fonts.js"></script>
  <script src="js/document.js"></script>
  <script src="js/selection.js"></script>
  <script src="js/inpaint.js"></script>
  <script src="js/view.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/collage.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
