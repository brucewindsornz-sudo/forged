name: Web image

# Builds the Forged Web container for amd64 and arm64 (Raspberry Pi) and publishes it to
# ghcr.io/brucewindsornz-sudo/forged-web. Runs on Linux, so it doesn't need the macOS runner.
on:
  push:
    branches: [main]
    paths: ["src/renderer/**", "src/fonts.js", "web/**", ".github/workflows/web-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the server and build
        run: |
          node web/build.js /tmp/public
          FORGED_PUBLIC=/tmp/public FORGED_DATA=/tmp/data PORT=8099 node web/server.js & sleep 2
          curl -fsS localhost:8099/healthz && curl -fsS localhost:8099/api/info && curl -fsS -o /dev/null localhost:8099/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=$(node -p "require('./web/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/forged-web:latest
            ghcr.io/${{ github.repository_owner }}/forged-web:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
